# Declarative site spec for the SS Vibelandia Omniversal Canvas.
# Every network behavior of FractiSkills is bounded by this reviewed file:
# the discovery crawl, the per-section render crawl, and the same-origin
# dynamic-document augmentation bindings below.
id: ssvibelandia
name: SS Vibelandia Omniversal Canvas
base_url: https://www.ssvibelandiaquestfest24x365.com/
sitemap_url: https://www.ssvibelandiaquestfest24x365.com/sitemap.xml
user_agent: FractiSkills/0.1 (+https://github.com/docxology/FractiSkills; Skillarum-backed)

discovery:
  max_pages: 1500
  max_requests: 8000
  max_depth: 5
  min_delay_seconds: 0.25

crawl:
  min_delay_seconds: 0.5
  request_timeout_seconds: 30
  max_response_bytes: 3000000

extraction:
  max_chars_per_page: 60000

augment:
  timeout_seconds: 30

# Pages whose static HTML is a client-rendered shell, mapped to the
# same-origin JSON endpoint that carries the real document. {id} is the
# page's ?id= query value; {last_segment} is the final URL path segment.
bindings:
  - match_path: /interfaces/whitepaper-surface.html
    api_template: /api/whitepaper?id={id}
  - match_path: /whitepaper/
    api_template: /api/whitepaper?id={last_segment}
  - match_path: /papers
    api_template: /api/whitepaper-catalog
  - match_path: /special-projects/geomagnetic-herbivore-study
    api_template: /api/turner-recent-anomaly-report
